x-environment:
  &default-environment
    LAGOON_ROUTE: &default-url http://demo-lagoon-shared-solr.docker.amazee.io

x-user:
  &default-user
    user: '1000'

volumes:
  search:
    {}

services:
  solr:
    build:
      context: .
      dockerfile: lagoon/solr.dockerfile
    labels:
      lagoon.type: solr
      lagoon.service.port: 8983
      lagoon.autogeneratedroute: true
      lagoon.persistent: /var/solr
      lagoon.persistent.size: 2Gi
    ports:
      - "8983" 
    environment:
      << : *default-environment
    volumes:
      - search:/var/solr

networks:
  amazeeio-network:
    external: true
